[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e_bcrt_re_to_td"
version = "0.1.0"
description = "End-to-end research to trading pipeline with RL and LLM integrations"
authors = [
  {name = "Quant Research Team", email = "quant@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["reinforcement-learning", "finance", "trading", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.1",
  "statsmodels>=0.13",
  "ta>=0.10",
  "yfinance>=0.2",
  "langchain>=0.0.350",
  "openai>=1.0",
  "tqdm>=4.65",
  "pydantic>=2.0",
  "plotly>=5.15",
  "streamlit>=1.28",
  "dash>=2.14"
]

[project.optional-dependencies]
finrl = ["FinRL>=0.3.5"]
rllib = ["ray[rllib]>=2.6.0"]
notebooks = ["jupyterlab>=4.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://example.com/e2e-bcrt-re-to-td"
Documentation = "https://example.com/e2e-bcrt-re-to-td/docs"
Source = "https://example.com/e2e-bcrt-re-to-td/source"
Issues = "https://example.com/e2e-bcrt-re-to-td/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
